# ============================================================
#  unreagent — configuration for this example project
#
#  Portable & committable (no machine-specific paths). Machine overrides
#  (engine path, claude path) belong in unreagent.local.yaml (git-ignored).
# ============================================================

agent:
  enabled: true
  command: claude
  claudeIntegration: true        # attaches --mcp-config (+ permission-prompt-tool)
  window: true                   # own console window -> interactive Claude TUI

permissions:
  enabled: true
  mode: allow_all                # allow_all | allowlist | deny_all
  deny:
    - "Bash(rm -rf *)"

runtimes:
  python: { enabled: true }
  node:   { enabled: true }

# File tools (read_file/list_dir/write_file/edit_file) via the MCP server,
# strictly confined to the project directory. Handy with `-no-agent`:
# UE + MCP run, an external agent works on the project with no local presence.
files:
  enabled: true
  root: "${PROJECT_DIR}"
  readOnly: false

mcp:
  enabled: true
  address: 127.0.0.1:8765
  # In-editor MCP: UE LLM Toolkit (as a git submodule under Plugins/ue-llm-toolkit).
  # UE finds the nested .uplugin via recursive scan; the Node bridge lives
  # correspondingly deep:
  extraServers:
    ue-llm-toolkit:
      command: node
      args: ["${PROJECT_DIR}/Plugins/ue-llm-toolkit/Plugin/UELLMToolkit/Resources/mcp-bridge/index.js"]
      env:
        UNREAL_MCP_URL: "http://127.0.0.1:3000"

# unreal: and commands: are optional — editor path as well as compile/package
# are derived from ${ENGINE} + ${PROJECT}.
